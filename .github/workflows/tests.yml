name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint + unit tests (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Validate shipped configuration
        run: python -m app.cli lint-config

      - name: Unit tests (no network, no credentials)
        run: pytest -q

      - name: Repository secret scan
        run: python scripts/scan_secrets.py

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
      - name: Bandit (static security analysis)
        run: bandit -q -r src app -x tests -ll
      - name: Dependency audit
        run: pip-audit -r requirements.txt --strict || true
