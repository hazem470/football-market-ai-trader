# =============================================================================
# Football Market AI Trader - main configuration
# Values here are non-secret. SECRETS LIVE IN `.env` ONLY, never in this file.
# Environment variables override the values in this file.
# =============================================================================

app:
  name: football-market-ai-trader
  version: 1.0.0
  timezone: UTC

trading:
  # backtest | shadow | paper | live
  mode: backtest
  # Live trading additionally requires POLYMARKET_ALLOW_LIVE_TRADING=true
  # and the --confirm phrase on the CLI.
  live_trading: false
  # Ignore markets that start sooner than this (too little time to manage).
  min_minutes_to_start: 20
  # Ignore markets resolving further out than this (avoids low-information futures).
  max_hours_to_resolution: 240
  # Loop interval for shadow/paper/live workers, in seconds.
  poll_interval_seconds: 120
  # Price snapshots older than this are rejected before execution.
  max_price_age_seconds: 60
  # Football features older than this are rejected.
  max_feature_age_hours: 72

markets:
  # Only football/soccer markets are considered. Discovered, never hardcoded.
  sport_filter: soccer
  # Polymarket tag used to discover sports events (resolved dynamically at runtime
  # from /sports, this is only a fallback).
  fallback_sports_tag_id: 100350
  # Discovery page size for the Gamma keyset endpoints.
  page_limit: 100
  max_pages: 10
  # A market must clear these to be tradeable at all.
  min_liquidity: 100
  min_volume_24h: 0
  max_spread: 0.04
  min_hours_to_resolution: 1
  exclude_market_types:
    - MATCH_RESULT
    - TOTAL_GOALS
    - BTTS
    - CORNERS
    - TEAM_TOTALS
    - PLAYER_GOAL
    - PLAYER_SHOTS
    - PLAYER_ASSIST
    - CARDS
    - OFFSIDES
    - FOULS
    - PENALTIES
    - SUBSTITUTIONS
    - HALFTIME_RESULT
    - SECOND_HALF_RESULT
    - EXACT_SCORE
    - FIRST_TO_SCORE
    - TEAM_TO_ADVANCE
    - GOALKEEPER_SAVES
    - PLAYER_GOALS_PLUS_ASSISTS
    - FIRST_CORNER
    - CORNERS_ODD_EVEN
    - EXTRA_TIME
    - PENALTY_SHOOTOUT
    - UNKNOWN

strategy:
  # Minimum realistic edge (after costs + uncertainty) required to trade.
  min_edge: 0.08
  # Minimum model confidence (1 - normalised uncertainty) required to trade.
  min_confidence: 0.75
  # Cost model used by the edge engine.
  fee_rate: 0.0            # Polymarket taker fee in practice is 0 for most markets
  assumed_slippage: 0.008  # 0.8c per share of expected adverse fill
  # Uncertainty penalties subtracted from raw edge.
  model_uncertainty: 0.02
  data_uncertainty: 0.01
  execution_uncertainty: 0.005
  # Prefer NO TRADE when in doubt.
  no_trade_on_unknown_market: true
  no_trade_on_stale_data: true

models:
  # Dixon-Coles style bivariate Poisson family, fitted per league from history.
  match_result:
    min_history_matches: 120
    max_goals: 10
    rho: -0.05          # low-score correction
    recency_halflife_days: 180
  total_goals:
    min_history_matches: 120
    max_goals: 12
  btts:
    min_history_matches: 120
    max_goals: 10
  corners:
    min_history_matches: 60
    dispersion: 0.0     # 0 -> Poisson, >0 -> negative binomial
  team_totals:
    min_history_matches: 120
    max_goals: 10
  player_goal:
    min_history_matches: 6
    league_average_goals_per_team_match: 1.4
  player_shots:
    min_history_matches: 6
    dispersion: 0.35
  player_assist:
    min_history_matches: 6
  # Model/feature/calibration versioning (recorded with every prediction).
  versions:
    model: 1.0.0
    features: 1.0.0
    calibration: 1.0.0

calibration:
  enabled: true
  method: platt        # platt | isotonic | none
  min_samples: 30
  artifact_path: artifacts/calibration.json

risk:
  capital: 500.0
  max_trade: 10.0
  max_daily_exposure: 50.0
  max_daily_loss: 20.0
  max_open_positions: 6
  min_liquidity: 100.0
  max_slippage: 0.02
  max_correlated_exposure: 25.0
  kelly_fraction: 0.25
  exposure_groups: [match, team, player, event, family]
  circuit_breaker:
    max_consecutive_errors: 5
    max_stale_data_minutes: 180
    abnormal_price_move: 0.25
    enable: true

paper:
  starting_balance: 100.0
  rejection_rate: 0.02        # simulated exchange rejections
  slippage_model: spread      # spread | fixed
  fixed_slippage: 0.005
  min_fill_ratio: 0.25        # liquidity-aware partial fills

backtest:
  starting_balance: 1000.0
  # Bookmaker closing odds are converted to a "market price" proxy after
  # removing the bookmaker overround. See docs/ARCHITECTURE.md (limitations).
  price_source: bookmaker     # bookmaker | model_market_blend
  bookmaker: B365
  edge_capture: 1.0           # fraction of theoretical edge assumed captured
  min_history_matches: 120

data:
  providers:
    football_data_uk:
      enabled: true
      base_url: https://www.football-data.co.uk
      # Season code and league codes are PUBLIC identifiers (see
      # https://www.football-data.co.uk/notes.txt), not credentials.
      season: "2526"
      leagues: [E0, E1, D1, I1, SP1, F1, N1, P1]
      cache_ttl_hours: 24
      timeout_seconds: 30
    fpl:
      enabled: true
      base_url: https://fantasy.premierleague.com/api
      cache_ttl_hours: 6
      timeout_seconds: 30
    openfootball:
      enabled: true
      base_url: https://raw.githubusercontent.com/openfootball/football.json/master
      cache_ttl_hours: 24
      timeout_seconds: 30
    polymarket_gamma:
      enabled: true
      cache_ttl_minutes: 1
      timeout_seconds: 20
    polymarket_clob:
      enabled: true
      cache_ttl_seconds: 20
      timeout_seconds: 20
  validation:
    max_market_price_age_seconds: 60
    max_match_stats_age_days: 30
    min_coverage_ratio: 0.8   # required share of non-null required fields
    allow_partial_history: false

ai:
  enabled: false
  provider: openrouter
  model: openai/gpt-4o-mini
  base_url: https://openrouter.ai/api/v1
  timeout_seconds: 45
  # The LLM may only produce structured facts. It can never emit BUY/SELL.
  forbidden_output_fields: [decision, side, size, price, order]
  max_news_items_per_match: 8

notifications:
  console: true
  telegram:
    enabled: false
    min_edge_to_notify: 0.08
    notify_on: [opportunity, order_submitted, order_filled, position_closed, daily_summary,
                risk_limit_reached, provider_failure, execution_failure, stopped, circuit_breaker]

dashboard:
  title: Football Market AI Trader
  refresh_seconds: 30

logging:
  level: INFO
  json: false
  dir: logs
  redact_keys: [private_key, api_secret, api_key, passphrase, bot_token, seed, mnemonic, authorization]
