[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-market-ai-trader"
version = "1.0.0"
description = "Open-source football prediction + Polymarket trading research engine (backtest / shadow / paper / live)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Football Market AI Trader contributors" }]
keywords = ["polymarket", "football", "soccer", "quant", "prediction-markets", "backtesting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36,<2"]
live = ["py-clob-client>=0.34,<1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "network: tests that hit the public internet (deselected by default in CI)",
  "slow: long-running tests",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
